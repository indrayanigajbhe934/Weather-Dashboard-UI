
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-container">
        <h1>Weather Dashboard</h1>
        <p class="subtitle">Check your daily weather</p>

        <div class="search-box">
            <input type="text" id="cityInput"
                   placeholder="Enter city name">
            <button id="searchButton">Search</button>
        </div>

        <section class="weather-card">
            <h2 id="cityName">Pune</h2>
            <p id="date">Today's Weather</p>

            <div class="weather-icon">☀️</div>
            <h3 id="temperature">28°C</h3>
            <p id="condition">Sunny</p>

            <div class="weather-details">
                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong>55%</strong>
                </div>
                <div>
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong>12 km/h</strong>
                </div>
            </div>
        </section>

        <p class="note">
            Demo weather information for UI demonstration only.
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
